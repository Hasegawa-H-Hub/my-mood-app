<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>記録一覧 | My Mood</title>
</head>
<!-- 画面全体 -->
<body>
    <!-- ヘッダー -->
    <header>
        <!-- ロゴ -->
        <h1>My Mood</h1>
        <!-- 記録作成ボタン -->
        <a th:href="@{/records/new}"><span aria-hidden="true">＋</span>記録する</a>
    </header>
    <!-- メイン -->
    <main>
        <p th:if="${message != null}" th:text="${message}" role="status"></p>
        <p th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></p>

        <!-- 絞り込み・並び替えは後日実装するため、一時的に無効化 -->
        <!--/*-->
        <!-- 絞り込み・並び替え -->
        <section>
            <form method="get">
                <!-- 気分で絞り込み -->
                <fieldset>
                    <legend>気分で絞り込み：</legend>
                    <!-- うれしい -->
                    <label>
                        <input type="checkbox" name="moodIds" value="1"
                               th:checked="${selectedMoodIds == null or selectedMoodIds.contains(1)}">
                        うれしい
                    </label>
                    <!-- たのしい -->
                    <label>
                        <input type="checkbox" name="moodIds" value="2"
                               th:checked="${selectedMoodIds == null or selectedMoodIds.contains(2)}">
                        たのしい
                    </label>
                    <!-- ふつう -->
                    <label>
                        <input type="checkbox" name="moodIds" value="3"
                               th:checked="${selectedMoodIds == null or selectedMoodIds.contains(3)}">
                        ふつう
                    </label>
                    <!-- かなしい -->
                    <label>
                        <input type="checkbox" name="moodIds" value="4"
                               th:checked="${selectedMoodIds == null or selectedMoodIds.contains(4)}">
                        かなしい
                    </label>
                    <!-- いらいら -->
                    <label>
                        <input type="checkbox" name="moodIds" value="5"
                               th:checked="${selectedMoodIds == null or selectedMoodIds.contains(5)}">
                        いらいら
                    </label>
                </fieldset>
                <!-- 期間で絞り込み -->
                <div>
                    <label>開始日
                        <input type="date" name="startDate" th:value="${startDate}">
                    </label>
                    〜
                    <label>終了日
                        <input type="date" name="endDate" th:value="${endDate}">
                    </label>
                </div>
                <!-- 並び替え -->
                <div>
                    <span>並び替え：</span>
                    <select name="sort">
                        <option value="desc" th:selected="${sort == 'desc'}">日付（新しい順）</option>
                        <option value="asc" th:selected="${sort == 'asc'}">日付（古い順）</option>
                    </select>
                </div>
                <!-- 全選択／解除ボタン -->
                <button type="button">全選択／解除</button>
                <!-- 絞り込みボタン -->
                <button type="submit">絞り込み</button>
            </form>
        </section>
        <!--*/-->

        <!-- 記録一覧 -->
        <section>
            <p th:if="${#lists.isEmpty(logs)}">記録はまだありません</p>
            <table th:unless="${#lists.isEmpty(logs)}" border="1">
                <thead>
                    <tr>
                        <th scope="col">日付</th>
                        <th scope="col">気分</th>
                        <th scope="col">ひとことメモ</th>
                        <th scope="col">メニュー</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <!-- 日付 -->
                        <td>
                            <span th:text="${#temporals.format(log.createdAt, 'yyyy/MM/dd（E）', T(java.util.Locale).JAPAN)}"></span>
                            <br>
                            <span th:if="${log.updatedAt != null}"
                                  th:text="|更新：${#temporals.format(log.updatedAt, 'yyyy/MM/dd（E）', T(java.util.Locale).JAPAN)}|"></span>
                        </td>
                        <!-- 気分 -->
                        <td>
                            <img th:if="${log.mood != null}"
                                 th:src="@{|/images/mood/${log.mood.moodName}.svg|}"
                                 th:alt="${log.mood.moodJa}"
                                 th:title="${log.mood.moodJa}"
                                 width="40" height="40">
                        </td>
                        <!-- ひとことメモ -->
                        <td th:text="${log.memo}"></td>
                        <!-- メニュー -->
                        <td>
							<!-- 更新 -->
                            <a th:href="@{/records/edit/{id}(id=${log.id})}">更新</a>

                            <!-- 削除 -->
                            <form th:action="@{/records/delete}" method="post"
                                  onsubmit="return confirm('この記録を削除しますか？');">
                                <input type="hidden" name="id" th:value="${log.id}">
                                <button type="submit">削除</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
