<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
		<link rel="stylesheet" th:href="@{/css/style.css}">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
		<link rel="icon" th:href="@{/favicon.ico}">
        
		<title th:text="${logForm.isNew()} ? '新しい記録 | My Mood' : '記録を編集 | My Mood'">記録フォーム画面</title>
        
		<script th:src="@{/js/form_script.js}" defer></script>
    </head>
    <body class="form-page">
        <header class="site-header">
			<!-- ロゴ -->
			<h1>
				<img class="logo" th:src="@{/images/logo.svg}" alt="My Mood">
			</h1>
        </header>

        <main class="main-content">
            <section class="form-card">
                <h2 class="form-title m-plus-rounded-1c-bold" th:text="${logForm.isNew()} ? '新しい記録' : '記録を編集'">新しい記録</h2>

                <form class="record-form" th:action="${logForm.isNew()} ? @{/records} : @{/records/update}"
                    th:object="${logForm}"
                    method="post">
                    <!-- 更新対象の記録IDをControllerへ渡す -->
                    <input type="hidden" th:field="*{id}">

                    <fieldset class="mood-fieldset">
                        <legend>気分</legend>
                        <div class="mood-option" th:each="mood : ${moods}">
                            <label class="mood-choice">
                                <input type="radio"
                                    th:field="*{moodId}"
                                    th:value="${mood.id}"
                                    required>
                                <img th:src="@{|/images/mood/${mood.moodName}.svg|}"
                                    th:alt="${mood.moodJa}"
                                    th:title="${mood.moodJa}"
                                    width="40" height="40">
                            </label>
                        </div>
                        <p class="field-error" th:if="${#fields.hasErrors('moodId')}"
                            th:errors="*{moodId}" role="alert"></p>
                    </fieldset>

                    <div class="memo-row">
                        <label for="memo">ひとことメモ</label>

                        <div class="memo-control">
                            <textarea id="memo"
                                th:field="*{memo}"
                                maxlength="200"
                                placeholder="ここに入力してください"
                                required></textarea>

                            <div class="character-count"><span id="memo-count">0</span> / 200</div>

                            <p class="field-error" th:if="${#fields.hasErrors('memo')}"
                                th:errors="*{memo}" role="alert"></p>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a class="button button-secondary" th:href="@{/records}">キャンセル</a>
                        <button class="button button-primary" type="submit">保存する</button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
