<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${logForm.isNew} ? '新しい記録 | My Mood' : '記録を編集 | My Mood'">記録フォーム画面</title>
</head>
<body>
    <header>
        <h1>My Mood</h1>
        <a th:href="@{/records}"><span aria-hidden="true">←</span>一覧に戻る</a>
    </header>

    <main>
        <section>
            <h2 th:text="${logForm.isNew} ? '新しい記録' : '記録を編集'">新しい記録</h2>

            <form th:action="${logForm.isNew} ? @{/records} : @{/records/update}"
                  th:object="${logForm}"
                  method="post">
                <!-- 更新対象の記録IDをControllerへ渡す -->
                <input type="hidden" th:field="*{id}">

                <fieldset>
                    <legend>気分</legend>
                    <div th:each="mood : ${moods}">
                        <label>
                            <input type="radio"
                                   th:field="*{moodId}"
                                   th:value="${mood.id}"
                                   required>
                            <img th:src="@{|/images/mood/${mood.moodName}.svg|}"
                                 th:alt="${mood.moodJa}"
                                 th:title="${mood.moodJa}"
                                 width="40" height="40">
                        </label>
                    </div>
                    <p th:if="${#fields.hasErrors('moodId')}"
                       th:errors="*{moodId}" role="alert"></p>
                </fieldset>

                <div>
                    <label for="memo">ひとことメモ</label>
                    <div>
                        <textarea id="memo"
                                  th:field="*{memo}"
                                  maxlength="200"
                                  placeholder="ここに入力してください"></textarea>
                        <div><span>0</span> / 200</div>
                        <p th:if="${#fields.hasErrors('memo')}"
                           th:errors="*{memo}" role="alert"></p>
                    </div>
                </div>

                <div>
                    <a th:href="@{/records}">キャンセル</a>
                    <button type="submit">保存する</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
